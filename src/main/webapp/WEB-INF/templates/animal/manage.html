<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head th:replace="~{fragments/header :: header}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<link href="../../../static/css/main.css" rel="stylesheet"/>
<link href="../../../static/css/animal/manage.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<body>
    <div th:replace="~{fragments/navigation :: bar}"></div>
    <div id="abandoned-animal-div">
        <div id="animal-nav">
            <h1> 실종동물 목록 </h1>
            <div class="animal-update">
                <button class="animal-syncBtn" th:attr="data-running=${running}">데이터 갱신</button>
                <!-- 크롤링 중에서는 spinner가 있는 것을 여기다가 백그라운드로 넣는 느낌? 으로 구현하면 될 듯 -->
                <div class="progress-bar">
                    <div class="loading-spinner"></div>
                    <div class="progress-bar-content hidden">
                        <div class="progress-bar-fill"></div>
                        <div class="progress-bar-keyword"></div>
                    </div>
                </div>
                <div class="last-update-time" th:text="|마지막 업데이트: ${updated_at}|">마지막 업데이트: 2025-03-13 12:51:00</div>
            </div>
        </div>
        <div class="divider"> </div>
        <div id="abandoned-animal-container">
            <div class="animal-box">
                <div class="animal-title dog">강아지</div>
                <div class="animal-list">
                    <div class="animal-preview" th:each="dog :${dog_preview}">
                        <div class="animal" th:text="${dog.title}">강아지</div>
                    </div>
                </div>
                <button class="animal-more"> 더보기 </button>
            </div>
            <div class="animal-box">
                <div class="animal-title cat">고양이</div>
                <div class="animal-list">
                    <div class="animal-preview" th:each="cat : ${cat_preview}">
                        <div class="animal" th:text="${cat.title}">고양이</div>
                    </div>
                </div>
                <button class="animal-more"> 더보기 </button>
            </div>
            <div class="animal-box">
                <div class="animal-title etc">기타 반려동물</div>
                <div class="animal-list">
                    <div class="animal-preview" th:each="etc : ${etc_preview}">
                        <div class="animal" th:text="${etc.title}">반려동물</div>
                    </div>
                </div>
                <button class="animal-more"> 더보기 </button>
            </div>
        </div>
    </div>
</body>
<script src="../../../static/js/animal/manage.js"></script>

</html>
