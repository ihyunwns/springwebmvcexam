<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head th:insert="~{fragments/header :: header}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Title</title>
</head>
<link href="../../../static/css/main.css" rel="stylesheet"/>
<link href="../../../static/css/board/boardForm.css" rel="stylesheet"/>
<link href="../../../static/css/board/reply.css" rel="stylesheet"/>

<script src="../../../static/js/reply-info.js"></script>
<body>
    <div th:replace="~{fragments/navigation :: bar}"></div>

    <div class="container">
        <a href="#" onclick="history.back()" class="back-button">뒤로가기</a>

        <div class="post">
            <h2 class="title" th:text="${title}"></h2>
            <p class="info" th:text="'작성일자:' + ${published}">작성일자: xxxx-xx-xx</p>
            <p class="info" th:text="'작성자: ' + ${author.id}" >작성자: 홍길동</p>
            <div class="btn-section" th:if="${POST_OWNER}">
                <form th:action="@{'/details/'+${postId}+'/edit'}" method="get" class="inline-form">
                    <button class="edit-btn" type="submit">수정하기</button>
                </form>
                <form th:action="@{'/details/'+${postId}+'/delete'}" method="get" class="inline-form">
                    <button class="delete-btn" type="submit">삭제하기</button>
                </form>
            </div>
            <hr>
            <div class="content">
                <pre th:text="${content}" style="font-family: Pretendard SemiBold, serif;"></pre>
            </div>
        </div>

        <div class="comments-section">
            <span>댓글</span>
            <div class="comment-input">
                <form id="comment_form" action="#">
                    <label>
                        <input type="text" id="comment_content" maxlength="100" placeholder="댓글을 입력하세요">
                    </label>
                    <button class="comment-submit" id="comment_btn" type="submit">></button>
                </form>
            </div>
            <hr>

            <div id="comment-list">
                <p class="comment-id"></p>
                <p class="comment-content"></p>
            </div>
        </div>
    </div>
</body>
</html>
<script th:inline="javascript">

    const postId = /*[[${postId}]]*/ "";
    const id = /*[[${id}]]*/ "";
    let loadComment = function loadComment() {
        fetch(`/comment/${postId}/load`)
            .then(response => response.json())
            .then(data => {
                const commentList = document.getElementById("comment-list");
                commentList.innerHTML = "";

                data.forEach(comment => {

                    const commentDiv = document.createElement("div");
                    commentDiv.className = "comment";
                    commentDiv.style.position = "relative";

                    /* 아이콘 ID 부분 */
                    const commentUserDiv = document.createElement("div");
                    commentUserDiv.className = "comment-user";

                    const commentUserIcon = document.createElement("img");
                    commentUserIcon.className = "comment-icon";
                    commentUserIcon.src = `/icon/${comment.commenterId}`;

                    const commentIdP = document.createElement("p");
                    commentIdP.className = "comment-id";
                    commentIdP.textContent = comment.commenterId;

                    commentUserDiv.appendChild(commentUserIcon);
                    commentUserDiv.appendChild(commentIdP);

                    /*  ------------------------------------------  */

                    /*                  댓글 내용                     */
                    const commentContentDiv = document.createElement("div");
                    commentContentDiv.className = "comment-content";

                    const commentContentP = document.createElement("span");
                    commentContentP.className = "comment-content-p"
                    commentContentP.textContent = comment.content;

                    const moreDiv = document.createElement("div");
                    moreDiv.className = "comment-more-container";

                    const commentPlus = document.createElement("span");
                    commentPlus.className = "comment-more"
                    commentPlus.textContent = "⋯";

                    const menuBox = document.createElement("div");
                    menuBox.className = "comment-menu";
                    /*  ------------------------------------------  */

                    // 메뉴 항목 추가 함수
                    function createMenuItem(label, onClick) {
                        const item = document.createElement("div");
                        item.className = "comment-menu-item";
                        item.textContent = label;
                        item.addEventListener("click", (event) => {
                            // 메뉴 클릭 시 자동 닫음
                            menuBox.style.display = "none";
                            // 실제 동작
                            onClick(event);
                        });
                        return item;
                    }

                    // 본인 댓글인 경우: "삭제", "수정"
                    if (comment.commenterId === id) {
                        menuBox.appendChild(createMenuItem("삭제", () => {
                            fetch(`/comment/${comment.id}/delete`, {method: 'GET'})
                                .then(response => {
                                    if (response.ok) {
                                        loadComment();
                                    } else {
                                        console.error('실패:', response.status);
                                    }
                                })
                                .catch(err => console.error('에러', err));
                        }));
                        menuBox.appendChild(createMenuItem("수정", () => {

                            // 이렇게 하면 특정 요소안에 있는 클래스들을 구분할 수 있게 됨
                            if (blockDuplicateForm("edit", commentDiv)) {
                                return;
                            }

                            fetch(`/comment/${comment.id}/edit`, { method: 'GET' })
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error(`응답 에러: ${response.status}`);
                                    }
                                    return response.json();
                                })
                                .then(data => {
                                    const editForm = document.createElement("form");
                                    editForm.className = "comment-editForm";

                                    const editContent = document.createElement("input");
                                    const editButton = document.createElement("button");
                                    editButton.textContent = ">";

                                    editContent.value = data.content;

                                    editForm.appendChild(editContent);
                                    editForm.appendChild(editButton);

                                    commentDiv.appendChild(editForm);

                                    editForm.addEventListener("submit", (event) => {
                                        event.preventDefault();

                                        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                                        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                                        fetch(`/comment/edit`,
                                            {
                                                method: "POST",
                                                headers: {
                                                    "Content-Type": "application/json",
                                                    [csrfHeader]: csrfToken // CSRF 헤더 추가
                                                },
                                                body: JSON.stringify({
                                                    content: editContent.value,
                                                    id: data.id
                                                })
                                            })
                                            .then( response => {
                                                if (response.ok) {
                                                    loadComment();
                                                } else {
                                                    console.error("댓글 수정 실패", response.status);
                                                }
                                            })
                                            .catch(error => console.error("댓글 수정 실패", error));
                                    })

                                })
                                .catch(err => console.error('에러', err));
                        }));
                    }
                    // 모두에게 공통: "답글"
                    menuBox.appendChild(createMenuItem("답글", () => {

                        if ( blockDuplicateForm("reply", commentDiv) ) {
                            return;
                        }

                        const replyForm = document.createElement("form");
                        replyForm.className = "comment-replyForm";

                        const replyContent = document.createElement("input");
                        const replyBtn = document.createElement("button");
                        replyBtn.textContent = '>';

                        replyForm.appendChild(replyContent);
                        replyForm.appendChild(replyBtn);

                        commentDiv.appendChild(replyForm);

                        replyForm.addEventListener('submit', (event) => {
                            event.preventDefault();

                            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                            fetch('/comment/reply', {
                                method: 'POST',
                                headers:
                                    {
                                        "Content-Type": "application/json",
                                        [csrfHeader]: csrfToken // CSRF 헤더 추가
                                    },
                                body: JSON.stringify({
                                    content: replyContent.value,
                                    id: comment.id,
                                    postId: comment.postId,
                                    commenterId: comment.commenterId
                                })
                            })
                                .then( response => {
                                    if (response.ok){
                                        loadComment();
                                    } else{
                                        console.error("답글 작성 실패", response.status);
                                    }
                                })
                                .catch(error => console.error("댓글 수정 실패", error));
                        })
                    }));

                    commentPlus.addEventListener("click", (event) => {
                        // 클릭 이벤트가 document까지 전달되어 전역에서 메뉴가 닫히지 않도록 버블링 방지
                        event.stopPropagation();

                        const isOpen = (menuBox.style.display === "block");
                        closeAllDropdowns();

                        if (isOpen) {
                            menuBox.style.display = "none";
                        } else {
                            menuBox.style.display = "block";
                        }

                    });

                    moreDiv.appendChild(commentPlus);
                    moreDiv.appendChild(menuBox);

                    commentContentDiv.appendChild(commentContentP);
                    commentContentDiv.appendChild(moreDiv);

                    commentDiv.appendChild(commentUserDiv);
                    commentDiv.appendChild(commentContentDiv);

                    const isExistChildren = comment.childExist;
                    if (isExistChildren) {
                        const replyPlus = document.createElement("div");
                        replyPlus.className = "comment-replyPlus";

                        const moreBtn = document.createElement("div");
                        moreBtn.className = "comment-replyMoreBtn";
                        moreBtn.textContent = "답글 " + isExistChildren + "개";

                        const replyList = document.createElement("div");
                        replyList.className = "comment-replyList";
                        replyList.style.display = "none";

                        replyPlus.appendChild(moreBtn); replyPlus.appendChild(replyList);
                        commentDiv.appendChild(replyPlus);

                        let isLoaded = false;

                        moreBtn.addEventListener("click", () => {

                            if (isLoaded) {
                                //이미 불러온 경우
                                if (replyList.style.display === "none") {
                                    replyList.style.display = "block";
                                    moreBtn.textContent = "답글 숨기기";
                                } else {
                                    replyList.style.display = "none";
                                    moreBtn.textContent = "답글 " + isExistChildren + "개";
                                }
                            } else {
                                 fetch(`/comment/${comment.id}/replies`, {method: "GET"})
                                .then(response => response.json())
                                .then(data => {
                                        data.forEach(replyComment => {

                                            let div = reply_info(replyComment);
                                            replyList.appendChild(div);

                                            moreBtn.textContent = "답글 숨기기";
                                            replyList.style.display = "block";
                                            isLoaded = true;
                                        })
                                    })
                                .catch(error => console.error("답글 불러오기 실패", error));
                            }
                        })
                    }
                    commentList.appendChild(commentDiv);
                })
            })
    };

    window.onload = loadComment;

    document.getElementById("comment_form").addEventListener("submit", function (event) {
        event.preventDefault(); // 컨트롤러로 form 데이터로 전송되는 것을 방지

        const content = document.getElementById("comment_content").value;

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        // form 태그에서 할 수도 있지만 그냥 해봤음
        fetch("/comment", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                [csrfHeader]: csrfToken // CSRF 헤더 추가
            },
            body: JSON.stringify({
                commenterId: id,
                content: content,
                postId: postId
            })
        })
        .then( response => {
            if (response.ok){
                document.getElementById("comment_content").value = "";
                loadComment();
            } else{
                console.error("댓글 작성 실패", response.status);
            }
        });
    });
</script>
<script>
    document.addEventListener("click", (event) => {

        // event.target comment-more-container 안에 있는지 확인
        const insideDropdownArea = event.target.closest(".comment-more-container");

        if (!insideDropdownArea) {
            closeAllDropdowns();
        }
    });
    function closeAllDropdowns() {
        const allMenus = document.querySelectorAll(".comment-menu");
        allMenus.forEach(menu => {
            menu.style.display = "none";
        });
    }

    function blockDuplicateForm(label, commentDiv) {

        const isExitsEditForm = commentDiv.querySelector(".comment-editForm");
        const isExitsReplyForm = commentDiv.querySelector(".comment-replyForm");

        if (label === "edit") {
            if (isExitsEditForm) {
                return true;
            }
            if (isExitsReplyForm) {
                isExitsReplyForm.remove();
            }

        } else {
            if (isExitsReplyForm) {
                return true;
            }
            if (isExitsEditForm) {
                isExitsEditForm.remove();
            }
        }
    }
</script>
