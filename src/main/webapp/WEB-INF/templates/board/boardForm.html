<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head th:replace="~{fragments/header :: header}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Title</title>
</head>
<link href="../../../static/css/main.css" rel="stylesheet"/>
<link href="../../../static/css/boardForm.css" rel="stylesheet"/>
<body>
    <div th:replace="~{fragments/navigation :: bar}"></div>

    <div class="container">
        <a href="#" onclick="history.back()" class="back-button">뒤로가기</a>

        <div class="post">
            <h2 class="title" th:text="${title}"></h2>
            <p class="info" th:text="'작성일자:' + ${published}">작성일자: xxxx-xx-xx</p>
            <p class="info" th:text="'작성자: ' + ${author.id}" >작성자: 홍길동</p>
            <div class="btn-section" th:if="${POST_OWNER}">
                <form th:action="@{'/details/'+${postId}+'/edit'}" method="get" class="inline-form">
                    <button class="edit-btn" type="submit">수정하기</button>
                </form>
                <form th:action="@{'/details/'+${postId}+'/delete'}" method="get" class="inline-form">
                    <button class="delete-btn" type="submit">삭제하기</button>
                </form>
            </div>
            <hr>
            <div class="content">
                <pre th:text="${content}" style="font-family: Pretendard SemiBold, serif;"></pre>
            </div>
        </div>

        <div class="comments-section">
            <span>댓글</span>
            <div class="comment-input">
                <label>
                    <input type="text" id="comment_content" maxlength="100" placeholder="댓글을 입력하세요">
                </label>
                <button class="comment-submit" id="comment_btn" type="submit">></button>
                <script th:inline="javascript">
                    let loadComment = function loadComment() {
                        var postId = /*[[${postId}]]*/ "";
                        fetch(`/comment/${postId}/load`)
                            .then(response => response.json())
                            .then(data => {
                                data.forEach(comment => {
                                    console.log(`Commenter: ${comment.commenterId} Content: ${comment.content}`)
                                })
                            })
                    };

                    window.onload = loadComment;

                    document.getElementById("comment_btn").addEventListener("click", function () {
                        const content = document.getElementById("comment_content").value;
                        const commenterId = /*[[${id}]]*/ "";
                        const postId = /*[[${postId}]]*/ "";

                        fetch("/comment", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                commenterId: commenterId,
                                content: content,
                                postId: postId
                            })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert("댓글이 등록되었습니다.")
                                loadComment();
                            } else {
                                alert("댓글 등록 중 오류가 발생했습니다.");
                            }
                        });
                    });
                </script>
            </div>

            <div class="comment">
                <p class="comment-id">ID: user123</p>
                <p class="comment-content">내용: 댓글 내용입니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
