<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eng">
<head th:replace="~{fragments/header :: header}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<link href="../../../static/css/main.css" rel="stylesheet"/>
<link href="../../../static/css/chat/waiting.css" rel="stylesheet"/>

<body>
    <div th:replace="~{fragments/navigation :: bar}"></div>
    <div class="waiting-room">
        <!-- 채팅방 리스트 -->
        <div class="room-list">
            <h2>채팅방 리스트</h2>
            <div th:each="room :${pagedChatRooms.pagedList}" class="room">
                <span style="font-size: 20px" th:text="${room.title}">방 제목</span>
                <div class="room-info">
                    <div class="room-owner" th:text="|${room.id}의 방|">소유자</div>
                    <div class="room-controller">
                        <div class="room-count" th:text="|${room.count} 명|">x 명</div>
                        <button class="join-btn" th:attr="data-uuid=${room.uuid}">입장</button>
                        <button th:if="${room.isOwner}" th:attr="data-uuid=${room.uuid}" class="delete-btn">삭제</button>
                    </div>
                </div>
            </div>
            <div id="pagination"></div>

            <div id="roomModal" class="modal">
                <div class="modal-content">
                    <h2>방 만들기</h2>
                    <form id="roomForm" th:action="@{/chat/create}" th:object="${chatRoomDTO}" method="post">
                        <input type="text" id="roomName" th:field="*{title}" placeholder="방 이름을 입력하세요">
                        <br><br>
                        <button class="create-btn" type="submit">생성</button>
                        <button class="cancel-btn" type="button">취소</button>
                    </form>
                </div>
            </div>
    <!--        이렇게 하니까 화면이 재렌더링 되서 사용성이 좀 떨어지긴 하네.. -->
            <div th:if="${errorMessage}" style="color:#F44336; margin-top: 12px" th:text="${errorMessage}">에러 메시지</div>

        </div>

        <!-- 방 만들기 버튼 -->
        <button class="create-room-btn">방 만들기</button>
    </div>
    <div th:attr="data-page=${pagedChatRooms.page}" id="page" hidden></div>
    <div th:attr="data-size=${pagedChatRooms.size}" id="size" hidden></div>
    <div th:attr="data-total-elements=${pagedChatRooms.totalElements}" id="totalElements" hidden></div>
    <div th:attr="data-total-pages=${pagedChatRooms.totalPages}" id="totalPages" hidden></div>
</body>
<script src="../../../static/js/chat/waiting.js"></script>
</html>
